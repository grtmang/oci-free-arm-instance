name: Try to Create OCI VM

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}
  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Add OCI CLI to path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup OCI CLI Config
        run: |
          pip install oci-cli
          mkdir -p ~/.oci
          
          cat << 'EOF' > ~/.oci/oci_api_key.pem
          ${{ secrets.OCI_CLI_KEY_CONTENT }}
          EOF
          chmod 600 ~/.oci/oci_api_key.pem

          echo "[DEFAULT]" > ~/.oci/config
          echo "user=${{ secrets.OCI_CLI_USER }}" >> ~/.oci/config
          echo "tenancy=${{ secrets.OCI_CLI_TENANCY }}" >> ~/.oci/config
          echo "fingerprint=${{ secrets.OCI_CLI_FINGERPRINT }}" >> ~/.oci/config
          echo "key_file=~/.oci/oci_api_key.pem" >> ~/.oci/config
          echo "region=${{ env.OCI_CLI_REGION }}" >> ~/.oci/config
          
          chmod 600 ~/.oci/config
          echo "${{ secrets.SSH_PUBLIC_KEY }}" > /home/runner/my_ssh_key.pub

      - name: 🔍 测试 API 认证
        run: |
          oci iam region list --output table || { echo "DISCORD_MSG=❌ **认证中断！** 无法连接甲骨文，请检查 Secrets 配置。" >> $GITHUB_ENV; exit 1; }

      - name: Try to Launch VM
        id: create_vm
        continue-on-error: true 
        run: |
          set -o pipefail
          OCI_OUTPUT=$(oci compute instance launch \
            --compartment-id "$COMPARTMENT_ID" \
            --availability-domain "$AD_NAME" \
            --shape "VM.Standard.A1.Flex" \
            --shape-config '{"ocpus":4,"memoryInGBs":24}' \
            --subnet-id "$SUBNET_ID" \
            --image-id "$IMAGE_ID" \
            --ssh-authorized-keys-file "/home/runner/my_ssh_key.pub" \
            --assign-public-ip true \
            --display-name "coolify-vm" \
            --boot-volume-size-in-gbs 100 2>&1 || true)
          
          if echo "$OCI_OUTPUT" | grep -q '"lifecycle-state": "PROVISIONING"'; then
            echo 'DISCORD_MSG=🎉 **【特大喜讯】抢占成功！** 你的 4核24G 免费神机正在开机，请**立刻**去 GitHub 关闭此工作流以免封号！' >> $GITHUB_ENV
            exit 0
          elif echo "$OCI_OUTPUT" | grep -q 'Out of host capacity'; then
            echo 'DISCORD_MSG=⏳ **机房缺货，正常排队中...** (Out of host capacity)。脚本正在云端挂机，5 分钟后将自动发起下一次冲锋。' >> $GITHUB_ENV
            exit 1
          else
            # 如果出现我们没见过的未知报错，依然把日志打出来方便排查
            EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
            echo "DISCORD_MSG<<$EOF" >> $GITHUB_ENV
            echo "⚠️ **触发未知报错：**" >> $GITHUB_ENV
            echo "\`\`\`json" >> $GITHUB_ENV
            echo "$OCI_OUTPUT" >> $GITHUB_ENV
            echo "\`\`\`" >> $GITHUB_ENV
            echo "$EOF" >> $GITHUB_ENV
            exit 1
          fi

      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: "甲骨文云排队播报"
          status: ${{ steps.create_vm.outcome || 'failure' }}
          color: ${{ steps.create_vm.outcome == 'success' && '0x28a745' || '0x6c757d' }}
          description: ${{ env.DISCORD_MSG || '执行中断，未获取到状态反馈。' }}
